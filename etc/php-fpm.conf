[global]
pid = /var/run/php-fpm85/php-fpm.pid
process.max = 512
error_log = /proc/self/fd/2

[app]
clear_env = no
user = yujiro
group = yujiro
listen = /var/run/php-fpm85/app.sock
listen.owner = yujiro
listen.group = yujiro
listen.mode = 0660
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[date.timezone] = 'Asia/Tokyo'
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[max_execution_time] = 1200
php_admin_value[max_input_time] = 0
php_admin_value[default_socket_timeout] = -1
php_admin_flag[output_buffering] = off
php_admin_flag[zlib.output_compression] = off
