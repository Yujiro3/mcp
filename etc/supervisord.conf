[supervisord]
nodaemon=true
loglevel=info
user=root

[program:php-fpm]
command=/usr/sbin/php-fpm85 --fpm-config /opt/etc/php-fpm.conf --nodaemonize
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /opt/etc/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
